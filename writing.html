<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing – Ubahn_archiv</title>

  <!-- Fira Sans from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ececec;
      --ink: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fira Sans', Arial, Helvetica, sans-serif;
      cursor: url('train_cursor.png') 0 0, auto;
    }

    /* ============================================================
       TOP‑RIGHT BUTTON (back to photos)
       ============================================================ */
    .photos-link {
      position: fixed;
      top: 20px;
      right: 48px;
      z-index: 100;
      font-family: 'Fira Sans', Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--ink);
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: url('train_cursor.png') 0 0, pointer;
      transition: opacity 0.3s ease;
    }

    .photos-link:hover {
      opacity: 0.6;
    }

    /* ============================================================
       GRAIN OVERLAY
       ============================================================ */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('grain.gif');
      opacity: 0.07;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 9999;
    }

    /* ============================================================
       STICKY TITLE
       ============================================================ */
    .site-title {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 48px;
      background: transparent;
      pointer-events: none;
    }

    .site-title img {
      display: block;
      height: 30px;
      width: auto;
    }

    /* ============================================================
       JOURNAL CONTENT
       ============================================================ */
    .journal {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 48px 120px;
      position: relative;
      z-index: 2;
    }

    .entry {
      margin-bottom: 64px;
    }

    .entry-date {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .entry-text {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .site-title {
        height: 56px;
        padding: 0 20px;
      }
      .site-title img {
        height: 22px;
      }
      .journal {
        padding: 20px 20px 80px;
      }
      .photos-link {
        right: 20px;
      }
    }

    @media (max-width: 460px) {
      .entry {
        margin-bottom: 48px;
      }
    }
  </style>
</head>
<body>

  <!-- Grain overlay -->
  <div class="grain-overlay"></div>

  <!-- Top‑right button back to archive (skip entrance) -->
  <a href="index.html?skip=true" class="photos-link">photos</a>

  <!-- Sticky title -->
  <header class="site-title">
    <img src="ubahn_00000.gif" alt="Ubahn_archiv">
  </header>

  <!-- Journal entries -->
  <main class="journal">
    
    <div class="entry">
      <div class="entry-date">Jan 1st 2026 &nbsp; U8</div>
      <p class="entry-text">
        The train is warm somehow, outside it is relentless. The coldest winter in 16 years is repeated ad nauseam, I believe it every time.
      </p>
    </div>

    <!-- Add more entries here -->

  </main>

</body>
</html>
