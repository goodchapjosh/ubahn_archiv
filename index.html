<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubahn_archiv</title>

  <!-- Fira Sans from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ececec;
      --ink: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fira Sans', Arial, Helvetica, sans-serif;
      overflow: hidden;
      cursor: url('train_cursor.png') 0 0, auto;
    }

    /* ============================================================
       ENTRANCE PAGE
       ============================================================ */
    .entrance {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 10000;
      cursor: url('train_cursor.png') 0 0, pointer;
      transition: opacity 0.5s ease;
    }

    .entrance.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .entrance-gif {
      max-width: 117%;
      max-height: 117vh;
      object-fit: contain;
    }

    /* ============================================================
       MAIN SITE
       ============================================================ */
    .main-site {
      display: none;
    }

    .main-site.visible {
      display: block;
    }

    /* ============================================================
       TOP‑RIGHT NAVIGATION — now behind photos
       ============================================================ */
    .top-nav {
      position: fixed;
      top: 20px;
      right: 48px;
      z-index: 0; /* behind photos (which are z-index: 2) */
      display: flex;
      gap: 24px;
    }

    .top-nav a {
      font-family: 'Fira Sans', Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--ink);
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: url('train_cursor.png') 0 0, pointer;
      transition: opacity 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.6;
    }

    /* ============================================================
       GRAIN OVERLAY
       ============================================================ */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('grain.gif');
      opacity: 0.07;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 9999;
    }

    /* ============================================================
       STICKY TITLE
       ============================================================ */
    .site-title {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 48px;
      background: transparent;
      pointer-events: none;
    }

    .site-title img {
      display: block;
      height: 30px;
      width: auto;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 48px 120px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column-reverse;
    }

    .intro-spacer {
      height: 8px;
    }

    .photo-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin: 0 0 96px;
      flex-direction: row;
      position: relative;
      z-index: 2;
      padding-left: 100px;
    }

    .photo-year {
      flex: 0 0 80px;
      text-align: left;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: var(--ink);
      padding-bottom: 2px;
      align-self: flex-end;
      position: relative;
      z-index: 2;
    }

    .photo {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 800px;
      background: #d9d9d9;
      margin: 0;
      position: relative;
      z-index: 2;
    }

    .photo-frame {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ============================================================
       RESPONSIVE — photos go wide on mobile
       ============================================================ */
    @media (max-width: 640px) {
      .site-title {
        height: 56px;
        padding: 0 12px;
      }
      .site-title img {
        height: 22px;
      }
      main {
        padding: 0 8px 80px; /* much less side padding = wider photos */
      }
      .photo-row {
        padding-left: 8px; /* minimal left push on mobile */
        gap: 8px;
        margin-bottom: 64px;
      }
      .photo-year {
        flex: 0 0 40px;
        font-size: 9px;
      }
      .photo {
        max-width: 100%; /* allow photo to fill the screen */
      }
      .entrance-gif {
        max-width: 104%;
        max-height: 104vh;
      }
      .top-nav {
        right: 12px;
        gap: 16px;
      }
    }

    @media (max-width: 460px) {
      .photo-row {
        padding-left: 4px;
        gap: 6px;
        margin-bottom: 48px;
      }
      .photo-year {
        flex: 0 0 32px;
        font-size: 8px;
        padding-bottom: 1px;
      }
      .photo {
        max-width: 100%;
      }
      .entrance-gif {
        max-width: 91%;
        max-height: 91vh;
      }
      main {
        padding: 0 4px 60px;
      }
    }

    .photo {
      min-width: 150px;
    }
  </style>
</head>
<body>

  <audio id="siteSound" preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
    <source src="sound.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  <div class="entrance" id="entrance" onclick="handleEntranceClick(event)">
    <img class="entrance-gif" src="entrance.gif" alt="Entrance">
  </div>

  <div class="main-site" id="mainSite">
    
    <div class="grain-overlay"></div>

    <!-- Writing link — now behind photos (z-index: 0) -->
    <nav class="top-nav">
      <a href="writing.html">writing</a>
    </nav>

    <header class="site-title">
      <img src="ubahn_00000.gif" alt="Ubahn_archiv">
    </header>

    <main>
      <div class="intro-spacer"></div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_1.jpg" alt="Ubahn photo 1">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_2.jpg" alt="Ubahn photo 2">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_3.jpg" alt="Ubahn photo 3">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_4.jpg" alt="Ubahn photo 4">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_5.jpg" alt="Ubahn photo 5">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_6.jpg" alt="Ubahn photo 6">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_7.jpg" alt="Ubahn photo 7">
        </figure>
        <span class="photo-year">2025</span>
      </div>

      <div class="photo-row">
        <figure class="photo">
          <img class="photo-frame" src="ubahn_8.jpg" alt="Ubahn photo 8">
        </figure>
        <span class="photo-year">2025</span>
      </div>

    </main>

  </div>

  <script>
    const siteSound = document.getElementById('siteSound');
    let soundPlayed = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('skip') === 'true') {
      document.getElementById('entrance').style.display = 'none';
      document.getElementById('mainSite').classList.add('visible');
      document.body.style.overflow = 'auto';
    }

    function handleEntranceClick(event) {
      if (!soundPlayed) {
        siteSound.play().catch(err => console.log('Audio play failed:', err));
        soundPlayed = true;
      }
      enterSite();
    }

    function enterSite() {
      const entrance = document.getElementById('entrance');
      const mainSite = document.getElementById('mainSite');
      
      entrance.classList.add('hidden');
      
      setTimeout(() => {
        entrance.style.display = 'none';
        mainSite.classList.add('visible');
        document.body.style.overflow = 'auto';
      }, 500);
    }
  </script>
</body>
</html>
